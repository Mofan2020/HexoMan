name: Release

# 推 v* tag 时自动出包：xcodegen → Release 编译 → 压 zip → 发 GitHub Release。
# 产物是 ad-hoc 签名、未公证的 .app，Gatekeeper 会拦，绕过方法写在 Release body 里。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    # 部署目标是 macOS 26.0，需要带 macOS 26+ SDK 的 Xcode（Xcode 26 或更高）。
    runs-on: macos-15

    env:
      XCODE_PATH: ${{ vars.XCODE_PATH }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 要拿到 tag 之间的完整提交历史，更新日志才拼得出来。
          fetch-depth: 0

      - name: 准备 Xcode
        run: |
          set -euo pipefail
          if [ -n "${XCODE_PATH}" ]; then
            echo "使用仓库变量指定的 Xcode：${XCODE_PATH}"
            sudo xcode-select -s "${XCODE_PATH}"
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: 校验 macOS SDK 版本
        run: |
          set -euo pipefail
          sdks="$(xcodebuild -showsdks | awk '/^macOS SDKs:/{f=1;next} /^$/{f=0} f {print $2}' | sort -u -V)"
          echo "可用 macOS SDK："
          echo "${sdks}"
          if [ -z "${sdks}" ]; then
            echo "::error::没有找到任何 macOS SDK。runner 上缺少 Xcode 命令行工具，请检查镜像，或在仓库变量里用 XCODE_PATH 指定 Xcode 26+ 的 Xcode.app。"
            exit 1
          fi
          latest="$(echo "${sdks}" | tail -n 1)"
          major="${latest%%.*}"
          if [ "${major}" -lt 26 ]; then
            echo "::error::部署目标是 macOS 26.0，但当前最高 macOS SDK 只有 ${latest}。请改用带 macOS 26+ SDK 的 runner / Xcode 26 及以上版本。"
            exit 1
          fi
          echo "SDK 检查通过：${latest}"

      - name: 安装 XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1 && ! brew list xcodegen >/dev/null 2>&1; then
            echo "::notice::runner 上没有 xcodegen，开始安装……"
            brew install xcodegen
          fi
          xcodegen --version

      - name: 构建 Release
        # scripts/build-release.sh 已经封装好 xcodegen + Release 编译 + 拷贝产物，
        # 本地和 CI 用的是同一套命令。
        run: ./scripts/build-release.sh

      - name: 打包 zip
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="build/release/HexoMan.app"
          if [ ! -d "${app}" ]; then
            echo "::error::没找到 ${app}，构建可能没跑成功。"
            exit 1
          fi
          # -y 保留符号链接和权限位，app 包里的软链被压坏会直接打不开。
          zip -qry "HexoMan-${version}-macos.zip" "${app}"
          echo "name=HexoMan-${version}-macos.zip" >> "$GITHUB_OUTPUT"
          ls -lh "HexoMan-${version}-macos.zip"

      - name: 生成更新日志
        id: changelog
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## 更新日志"
            echo
            if [ -n "${previous}" ]; then
              echo "\`${previous}\` → \`${GITHUB_REF_NAME}\`："
              echo
              echo '```'
              git log --pretty=format:'%h %s' "${previous}..${GITHUB_REF_NAME}"
              echo '```'
            else
              echo "首个版本，全部提交："
              echo
              echo '```'
              git log --pretty=format:'%h %s' "${GITHUB_REF_NAME}"
              echo '```'
            fi
          } > changelog.md
          cat changelog.md

      - name: 写 Release 说明
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## HexoMan ${version}"
            echo
            echo "面向 macOS 的 Hexo 站点管理工具：管理站点、写文章、生成与预览站点、改配置、看 Git 状态。"
            echo
            echo "### 系统要求"
            echo
            echo "- macOS 26 或更高版本"
            echo "- 使用时本机需要安装 Node.js（用于运行 hexo）"
            echo
            echo "### ⚠️ 首次打开会被 Gatekeeper 拦住"
            echo
            echo "这个包是 **ad-hoc 签名（未公证）** 的，没有 Apple 开发者证书，所以 macOS 默认不允许直接双击打开。两种解决办法，任选其一："
            echo
            echo "1. 右键（或按住 Control 点击）\`HexoMan.app\` → 选「打开」→ 在弹窗里再点一次「打开」。"
            echo "2. 或者在终端里去掉隔离属性："
            echo
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/HexoMan.app"
            echo '```'
            echo
            echo "之后就可以正常双击启动了。"
            echo
            cat changelog.md
          } > release-notes.md

      - name: 上传 zip 作为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexoMan-${{ github.ref_name }}
          path: HexoMan-${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HexoMan ${{ github.ref_name }}
          body_path: release-notes.md
          files: ${{ steps.package.outputs.name }}
