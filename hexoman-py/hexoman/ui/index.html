<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HexoMan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">

    <!-- 侧边栏：站点切换器 + 功能栏 -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5.5A1.5 1.5 0 0 1 4 18.5z" />
              <path d="M4 17.2h15" />
              <path d="M8 8.4h7M8 12h5" />
            </svg>
          </span>
          <span class="brand-name" data-i18n="app.name">HexoMan</span>
        </div>
      </div>

      <!-- 站点切换器 -->
      <div class="site-switcher">
        <button class="site-switcher-button" id="site-switcher-button" type="button"
                aria-haspopup="listbox" aria-expanded="false">
          <span class="site-switcher-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l1.6 2h9.2A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" />
            </svg>
          </span>
          <span class="site-switcher-text">
            <span class="site-switcher-name" id="current-site-name" data-i18n="sites.empty">还没有站点</span>
            <span class="site-switcher-path" id="current-site-path"></span>
          </span>
          <span class="site-switcher-caret" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </span>
        </button>

        <div class="site-menu" id="site-menu" role="listbox" hidden>
          <div class="site-menu-list" id="site-menu-list"></div>
          <div class="site-menu-footer">
            <button class="menu-action" id="menu-add-site" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
              <span data-i18n="sites.addPath">添加站点目录</span>
            </button>
            <button class="menu-action" id="menu-manage-sites" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" />
              </svg>
              <span data-i18n="sites.title">站点管理</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 功能栏 -->
      <nav class="nav" id="nav" aria-label="功能"></nav>

      <div class="sidebar-foot">
        <div class="lang-toggle" role="group" id="lang-toggle" aria-label="语言"></div>
      </div>
    </aside>

    <!-- 右侧内容区 -->
    <main class="content" id="content">
      <header class="content-head">
        <h1 class="content-title" id="content-title"></h1>
        <div class="content-head-actions" id="content-head-actions"></div>
      </header>
      <div class="content-body" id="content-body"></div>
    </main>
  </div>

  <!-- 轻量提示条 -->
  <div class="toast-host" id="toast-host" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
