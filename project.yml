name: HexoMan
options:
  bundleIdPrefix: com.skyc8266
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_OBJC_ARC: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ENABLE_APP_SANDBOX: "NO"
    COMBINE_HIDPI_IMAGES: "YES"

targets:
  HexoMan:
    type: application
    platform: macOS
    sources:
      - path: HexoMan
        excludes:
          # Localizable.xcstrings 是资源文件，Xcode 自动处理，不参与编译。
          # 显式排除防止 XcodeGen 把它当 Swift 文件。
          - "Resources/Localizable.xcstrings"
      - path: HexoMan/Resources/Localizable.xcstrings
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_NAME: HexoMan
        PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.hexoman
        INFOPLIST_FILE: HexoMan/Resources/Info.plist
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # 本地化基础设施（PR1 引入）。
        # knownRegions 列在 INFOPLIST_KEY_CFBundleLocalizations，
        # 告诉 NSBundle 哪些 .lproj / .xcstrings 会被打包。
        # .environment(\.locale, ...) 靠这些资源在运行时找当前语言。
        INFOPLIST_KEY_CFBundleLocalizations: ["en", "zh-Hans", "ja"]
